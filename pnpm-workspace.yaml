linkWorkspacePackages: true

packages:
  - packages/*/*
  - packages/panda/themes/*
  - packages/studio
  - apps/*

allowBuilds:
  "@parcel/watcher": false
  esbuild: true
  node-pty: false
  sharp: false
  simple-git-hooks: false

# Supply-chain hardening (see https://pnpm.io/supply-chain-security)
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@ikona/cli@0.2.2"
  - "@zag-js/dismissable@2.0.0-next.4"
  - "@zag-js/interact-outside@2.0.0-next.4"
  - "@zag-js/dom-query@2.0.0-next.4"
  - "@zag-js/utils@2.0.0-next.4"
  - "@zag-js/types@2.0.0-next.4"
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # Legacy-line releases published without provenance after newer lines had it (long-vetted)
  - chokidar@4.0.3
  - semver@6.3.1

catalog:
  "@ark-ui/react": 6.0.0-next.0
  "@ark-ui/solid": 6.0.0-next.0
  "@ark-ui/svelte": 6.0.0-next.0
  "@ark-ui/vue": 6.0.0-next.0
  "@pandacss/compiler": 2.6.0
  "@pandacss/compiler-shared": 2.6.0
  "@pandacss/dev": 2.6.0
  "@pandacss/eslint-plugin": 2.6.0
  "@pandacss/mcp": 2.6.0
  "@pandacss/preset-base": 2.6.0
  "@pandacss/preset-typography": 2.6.0
  "@pandacss/transformer": 2.6.0
  "@pandacss/types": 2.6.0
  "@pandacss/vite": 2.6.0
  "@zag-js/anatomy": 2.0.0-next.3
  "@zag-js/checkbox": 2.0.0-next.3
  "@zag-js/collection": 2.0.0-next.3
  "@zag-js/core": 2.0.0-next.3
  "@zag-js/date-input": 2.0.0-next.3
  "@zag-js/dom-query": 2.0.0-next.3
  "@zag-js/focus-visible": 2.0.0-next.3
  "@zag-js/popover": 2.0.0-next.3
  "@zag-js/preact": 2.0.0-next.3
  "@zag-js/react": 2.0.0-next.3
  "@zag-js/solid": 2.0.0-next.3
  "@zag-js/store": 2.0.0-next.3
  "@zag-js/svelte": 2.0.0-next.3
  "@zag-js/types": 2.0.0-next.3
  "@zag-js/utils": 2.0.0-next.3
  "@zag-js/vanilla": 2.0.0-next.3
  "@zag-js/vue": 2.0.0-next.3
  "@storybook/addon-docs": ^10.6.7
  "@storybook/html-vite": ^10.6.7
  "@storybook/preact-vite": ^10.6.7
  "@storybook/react-vite": ^10.6.7
  "@storybook/svelte-vite": ^10.6.7
  "@storybook/vue3-vite": ^10.6.7
