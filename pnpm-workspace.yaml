linkWorkspacePackages: true

packages:
  - packages/*/*
  - apps/*

allowBuilds:
  "@parcel/watcher": false
  esbuild: true
  node-pty: false
  sharp: false

# Supply-chain hardening (see https://pnpm.io/supply-chain-security)
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - sugar-high@2.5.0
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # Legacy-line releases published without provenance after newer lines had it (long-vetted)
  - chokidar@4.0.3
  - semver@6.3.1
  # Panda CSS v2 beta packages published without provenance
  - "@pandacss/cli@2.0.0-beta.18"
  - "@pandacss/compiler@2.0.0-beta.18"
  - "@pandacss/compiler-shared@2.0.0-beta.18"
  - "@pandacss/preset-typography@2.0.0-beta.18"
  - "@pandacss/transformer@2.0.0-beta.18"

catalog:
  "@pandacss/compiler": 2.0.0-beta.18
  "@pandacss/dev": 2.0.0-beta.18
  "@pandacss/preset-base": 2.0.0-beta.18
  "@pandacss/preset-typography": 2.0.0-beta.18
  "@pandacss/transformer": 2.0.0-beta.18
  "@pandacss/types": 2.0.0-beta.18
  "@zag-js/anatomy": ^1.44.0
