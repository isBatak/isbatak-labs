linkWorkspacePackages: true

packages:
  - packages/*/*
  - apps/*

allowBuilds:
  "@parcel/watcher": false
  esbuild: true
  node-pty: false
  sharp: false

# Supply-chain hardening (see https://pnpm.io/supply-chain-security)
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - sugar-high@2.5.0
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # Legacy-line releases published without provenance after newer lines had it (long-vetted)
  - chokidar@4.0.3
  - semver@6.3.1

catalog:
  "@ark-ui/react": 6.0.0-next.0
  "@ark-ui/solid": 6.0.0-next.0
  "@ark-ui/svelte": 6.0.0-next.0
