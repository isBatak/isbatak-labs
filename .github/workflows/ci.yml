name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
  TURBO_TELEMETRY_DISABLED: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-lint-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-lint-
            turbo-${{ runner.os }}-build-
      - run: pnpm format:check
      - run: pnpm turbo run codegen --filter=@isbatak/solid-ui --filter=@isbatak/vue-ui --filter=@isbatak/compositions
      - run: pnpm lint --deny-warnings
      - if: always()
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-build-
      - run: pnpm turbo run build test typecheck $AFFECTED
      - if: always()
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true

  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-storybook-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-storybook-
            turbo-${{ runner.os }}-build-
      - run: pnpm turbo run build-storybook $AFFECTED
      - if: always()
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true

  ci:
    needs: [lint, build, storybook]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if:
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result,
          'skipped')
        run: exit 1

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: storybook
            project-id-secret: VERCEL_STORYBOOK_PROJECT_ID
          - app: website
            project-id-secret: VERCEL_WEBSITE_PROJECT_ID
    environment:
      name: ${{ matrix.app }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project-id-secret] }}
    steps:
      - name: Check Vercel secrets
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name (Settings > Secrets and variables > Actions)"
              missing=1
            fi
          done
          exit "${missing:-0}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: npm install --global --ignore-scripts vercel@59.23.2
      - run: vercel pull --yes --environment=production
      - name: Resolve production domain
        if: matrix.app == 'website'
        run: |
          domain=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/domains?teamId=$VERCEL_ORG_ID" \
            | jq -r '[.domains[] | select(.redirect == null and .gitBranch == null and .verified)]
              | sort_by(.name | endswith(".vercel.app")) | .[0].name // empty')
          if [ -z "$domain" ]; then
            echo "::error::No production domain found for the website Vercel project"
            exit 1
          fi
          echo "NEXT_PUBLIC_SITE_URL=https://$domain" >> "$GITHUB_ENV"
      - run: vercel build --prod
      - id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --archive=tgz)
          echo "url=$url" >> "$GITHUB_OUTPUT"
